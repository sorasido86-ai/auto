name: Site search health
on:
  push:
    branches: [main]
    paths: [site_search_health.py, content_quality.py, .github/workflows/site_search_health.yml]
  schedule:
    - cron: '30 7 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python site_search_health.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-search-health-${{ github.run_id }}
          path: artifacts/site_search_health.json
          retention-days: 14
