name: Refresh site sitemap
on:
  push:
    branches: [main]
    paths: [refresh_site_sitemap.py, .github/workflows/refresh_site_sitemap.yml]
  workflow_dispatch:
  workflow_run:
    workflows: ['Daily Recipe to WordPress (Naver-friendly)', 'Daily Recipe (Naverstyle)', 'Daily Korean Recipe to WordPress']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: sitemap-maintenance
  cancel-in-progress: false
jobs:
  refresh:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Regenerate sitemap cache and verify latest posts
        run: python refresh_site_sitemap.py
        env:
          WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sitemap-refresh-${{ github.run_id }}
          path: artifacts/sitemap_refresh_result.json
          if-no-files-found: ignore
          retention-days: 14
