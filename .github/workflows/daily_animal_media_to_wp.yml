name: Daily Animal Media to WordPress (2x)
'on':
  schedule:
  - cron: 10 0 * * *
  - cron: 10 9 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1: HTML 미리보기만 생성 / 0: 게시'
        type: choice
        options:
        - '1'
        - '0'
        default: '1'
        required: false
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m compileall -q .
        python -m unittest discover -s tests -v
    - name: Restore history
      uses: actions/cache/restore@v4
      with:
        path: data/daily_animal_media.sqlite3
        key: history-v2-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          history-v2-${{ github.workflow }}-${{ github.ref_name }}-
    - name: Determine RUN_SLOT
      id: slot
      shell: bash
      run: |
        S="${{ github.event.schedule }}"
        if [ "$S" = "10 0 * * *" ]; then
          echo "RUN_SLOT=am" >> $GITHUB_OUTPUT
        elif [ "$S" = "10 9 * * *" ]; then
          echo "RUN_SLOT=pm" >> $GITHUB_OUTPUT
        else
          echo "RUN_SLOT=" >> $GITHUB_OUTPUT
        fi
    - name: Run bot
      env:
        WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
        WP_USER: ${{ secrets.WP_USER }}
        WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        WP_STATUS: publish
        WP_CATEGORY_IDS: '3'
        SQLITE_PATH: data/daily_animal_media.sqlite3
        RUN_SLOT: ${{ steps.slot.outputs.RUN_SLOT }}
        LIMIT: '20'
        GIF_COUNT: '8'
        PHOTO_COUNT: '12'
        AVOID_REPEAT_DAYS: '14'
        UPLOAD_THUMB: '1'
        SET_FEATURED: '1'
        FORCE_NEW: '0'
        DEBUG: '0'
      run: |
        mkdir -p data
        python daily_animal_media_to_wp.py
    - name: Save history
      if: ${{ success() && env.DRY_RUN != '1' }}
      uses: actions/cache/save@v4
      with:
        path: data/daily_animal_media.sqlite3
        key: history-v2-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Upload content preview
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: content-preview-daily_animal_media_to_wp-${{ github.run_id }}
        path: artifacts/*.html
        if-no-files-found: ignore
        retention-days: 14
    timeout-minutes: 20
permissions:
  contents: read
env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: '1'
  DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
