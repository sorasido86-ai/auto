name: Daily Korean Recipe to WordPress
'on':
  push:
    branches: [main]
    paths:
    - daily_korean_recipe_to_wp.py
    - content_quality.py
    - wp_common.py
    - requirements.txt
    - .github/workflows/daily_korean_recipe_to_wp_no_image.yml
  schedule:
  - cron: 15 0 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1: HTML 미리보기만 생성 / 0: 게시'
        type: choice
        options:
        - '1'
        - '0'
        default: '1'
        required: false
permissions:
  contents: read
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m compileall -q .
        python -m unittest discover -s tests -v
    - name: Restore history
      uses: actions/cache/restore@v4
      with:
        path: data/daily_korean_recipe.sqlite3
        key: history-v2-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          history-v2-${{ github.workflow }}-${{ github.ref_name }}-
    - name: Run bot
      env:
        WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
        WP_USER: ${{ secrets.WP_USER }}
        WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_MODEL: gpt-5.4
        MFDS_API_KEY: ${{ secrets.MFDS_API_KEY }}
        DEFAULT_THUMB_URL: ${{ secrets.DEFAULT_THUMB_URL }}
        WP_STATUS: publish
        WP_CATEGORY_IDS: '7'
        WP_TAG_IDS: ''
        SQLITE_PATH: data/daily_korean_recipe.sqlite3
        RUN_SLOT: day
        FORCE_NEW: '0'
        REFRESH_EDITORIAL: ${{ github.event_name == 'push' && '1' || '0' }}
        DEBUG: '0'
        AVOID_REPEAT_DAYS: '90'
        MAX_TRIES: '12'
        MFDS_TIMEOUT: '10'
        MFDS_BUDGET_SECONDS: '20'
        STRICT_KOREAN: '1'
        MFDS_ONLY: '0'
        UPLOAD_THUMB: '1'
        SET_FEATURED: '1'
        EMBED_IMAGE_IN_BODY: '1'
        REUSE_MEDIA_BY_SEARCH: '1'
        HASHTAG_COUNT: '0'
      run: |
        python daily_korean_recipe_to_wp.py
    - name: Save history
      if: ${{ success() && env.DRY_RUN != '1' }}
      uses: actions/cache/save@v4
      with:
        path: data/daily_korean_recipe.sqlite3
        key: history-v2-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Upload content preview
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: content-preview-daily_korean_recipe_to_wp_no_image-${{ github.run_id }}
        path: artifacts/*
        if-no-files-found: ignore
        retention-days: 14
    timeout-minutes: 20
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: '1'
  DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
