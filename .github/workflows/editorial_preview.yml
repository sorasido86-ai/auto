name: Editorial storytelling preview
on:
  push:
    branches: [editorial-storytelling]
    paths: [content_quality.py, editorial_preview.py, .github/workflows/editorial_preview.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -q
      - name: Generate three previews without publishing
        run: python editorial_preview.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.2
          PYTHONUNBUFFERED: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-storytelling-${{ github.run_id }}
          path: artifacts/*
          retention-days: 14
