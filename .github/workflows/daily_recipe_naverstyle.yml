name: Daily Recipe (Naverstyle)
'on':
  push:
    branches: [main]
    paths:
    - daily_recipe_to_wp_naverstyle_FINAL.py
    - content_quality.py
    - wp_common.py
    - requirements.txt
    - .github/workflows/daily_recipe_naverstyle.yml
  workflow_dispatch:
    inputs:
      run_slot:
        description: day / am / pm
        required: false
        default: day
      dry_run:
        description: '1: HTML 미리보기만 생성 / 0: 게시'
        type: choice
        options:
        - '1'
        - '0'
        default: '1'
        required: false
  schedule:
  - cron: 10 0 * * *
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m compileall -q .
        python -m unittest discover -s tests -v
    - name: Restore history
      uses: actions/cache/restore@v4
      with:
        path: data/daily_recipe_naverstyle.sqlite3
        key: history-v2-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          history-v2-${{ github.workflow }}-${{ github.ref_name }}-
    - name: Run bot
      env:
        WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
        WP_USER: ${{ secrets.WP_USER }}
        WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        WP_STATUS: ${{ secrets.WP_STATUS }}
        WP_CATEGORY_IDS: ${{ secrets.WP_CATEGORY_IDS }}
        WP_TAG_IDS: ${{ secrets.WP_TAG_IDS }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        OPENAI_MODEL: gpt-5.2
        SQLITE_PATH: data/daily_recipe_naverstyle.sqlite3
        RUN_SLOT: ${{ github.event.inputs.run_slot || 'day' }}
        DEBUG: '0'
        ALWAYS_NEW: '0'
        REFRESH_EDITORIAL: ${{ github.event_name == 'push' && '1' || '0' }}
        NAVER_RANDOM_LEVEL: '2'
        NAVER_EXPERIENCE_LEVEL: '2'
        NAVER_MAIN_KEYWORD: ''
        NAVER_RECIPE_KEYWORDS: ${{ secrets.NAVER_RECIPE_KEYWORDS }}
        PREFER_AREAS: ${{ secrets.PREFER_AREAS }}
        BLOCK_CATEGORIES: ${{ secrets.BLOCK_CATEGORIES }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: |
        mkdir -p data
        ls -al
        python daily_recipe_to_wp_naverstyle_FINAL.py
    - name: Save history
      if: ${{ success() && env.DRY_RUN != '1' }}
      uses: actions/cache/save@v4
      with:
        path: data/daily_recipe_naverstyle.sqlite3
        key: history-v2-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Upload content preview
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: content-preview-daily_recipe_naverstyle-${{ github.run_id }}
        path: artifacts/*
        if-no-files-found: ignore
        retention-days: 14
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: '1'
  DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
