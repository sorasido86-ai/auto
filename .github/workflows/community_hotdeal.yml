name: Community Hotdeal TOP20 -> WordPress (AM/PM)
'on':
  schedule:
  - cron: 21 0 * * *
  - cron: 21 9 * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: '1: HTML 미리보기만 생성 / 0: 게시'
        type: choice
        options:
        - '1'
        - '0'
        default: '1'
        required: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install deps
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m compileall -q .
        python -m unittest discover -s tests -v
    - name: Restore history
      uses: actions/cache/restore@v4
      with:
        path: data/community_hotdeal.sqlite3
        key: history-v2-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          history-v2-${{ github.workflow }}-${{ github.ref_name }}-
    - name: Decide RUN_SLOT (am/pm)
      shell: bash
      run: |
        case "${{ github.event.schedule }}" in
          "21 0 * * *") SLOT=am ;;
          "21 9 * * *") SLOT=pm ;;
          *) HOUR=$(TZ=Asia/Seoul date +%H); if [ "$HOUR" -lt 12 ]; then SLOT=am; else SLOT=pm; fi ;;
        esac
        echo "RUN_SLOT=$SLOT" >> "$GITHUB_ENV"
    - name: Run bot
      env:
        WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
        WP_USER: ${{ secrets.WP_USER }}
        WP_APP_PASS: ${{ secrets.WP_APP_PASS }}
        WP_CATEGORY_IDS: '8'
        RUN_SLOT: ${{ env.RUN_SLOT }}
        SQLITE_PATH: data/community_hotdeal.sqlite3
        WINDOW_HOURS: '18'
        LIMIT: '20'
        DEBUG: '0'
      run: |
        set -e
        python community_hotdeal_top20_to_wp.py
    - name: Save history
      if: ${{ success() && env.DRY_RUN != '1' }}
      uses: actions/cache/save@v4
      with:
        path: data/community_hotdeal.sqlite3
        key: history-v2-${{ github.workflow }}-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
    - name: Upload content preview
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: content-preview-community_hotdeal-${{ github.run_id }}
        path: artifacts/*.html
        if-no-files-found: ignore
        retention-days: 14
    timeout-minutes: 20
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  TZ: Asia/Seoul
  PYTHONUNBUFFERED: '1'
  DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
